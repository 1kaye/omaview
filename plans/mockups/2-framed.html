<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
  .stage { flex: 1; }
  .transport { flex: none; background: var(--bar); border-top: 1px solid var(--line); padding: 16px 18px 12px; }
  .transport .track { margin: 0 4px 14px; }
  .row { display: flex; align-items: center; gap: 8px; }
</style></head>
<body><div class="app">
  <div class="topbar">
    <div class="title">coast-road.mkv <span class="meta">1920 × 1080 · H.264 · 48:10</span></div>
    <div class="spacer"></div>
    <div class="btn">Open<span class="key">⌃O</span></div>
    <div class="btn"><span data-icon="scissors"></span>Trim in Omacut<span class="key">E</span></div>
    <div class="btn primary">Copy frame<span class="key">⌃⇧C</span></div>
  </div>
  <div class="stage">
    <div class="frame" style="left:0; top:0; width:1440px; height:690px; left:107px; width:1226px" data-frame="coast"></div>
    <div class="sub" style="bottom:40px"><span>We kept driving until the road ran out of coast.</span></div>
  </div>
  <div class="transport">
    <div class="preview" style="left:calc(18% - 74px); bottom:116px"><div class="pic" data-frame="coast" data-t="-1"></div><div class="at">08:40</div></div>
    <div class="track"><div class="buf" style="width:46%"></div><div class="played" style="width:25%"></div><span class="head" style="left:25%"></span></div>
    <div class="row">
      <div class="ctl big"><span data-icon="pause" data-size="20"></span></div>
      <div class="ctl"><span data-icon="back" data-size="18"></span></div>
      <div class="ctl"><span data-icon="fwd" data-size="18"></span></div>
      <div class="time" style="margin-left:8px">12:04 <span class="of">/ 48:10</span></div>
      <div class="spacer"></div>
      <div class="pill">1.25× <span class="key">[ ]</span></div>
      <div class="pill"><span data-icon="subs" data-size="14"></span>English <span class="key">C</span></div>
      <div class="pill"><span data-icon="audio" data-size="14"></span>English 5.1 <span class="key">A</span></div>
      <div class="vol" style="margin-left:10px"><span data-icon="volume" data-size="18"></span><span class="bar"><i style="width:70%"></i></span></div>
      <div class="ctl"><span data-icon="full" data-size="18"></span></div>
    </div>
  </div>
  <div class="status">
    <span>Playing</span><span>·</span><span class="accent">resumed at 11:40</span>
    <div class="spacer"></div>
    <span>Space plays · ←→ seek 5s · ↑↓ volume · , . step a frame · F fullscreen</span>
    <span class="help">?</span>
  </div>
</div>
<script>hydrate()</script>
</body></html>
